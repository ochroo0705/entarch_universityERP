spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/schooldb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  api-docs:
    enabled: true
  integrations:
    mail:
      enabled: ${APP_MAIL_ENABLED:false}
    twilio:
      enabled: ${APP_TWILIO_ENABLED:false}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:true}
    mode: ${APP_BOOTSTRAP_MODE:full-demo}
  storage:
    type: ${APP_STORAGE_TYPE:local}
  seed:
    generate-risk-snapshots: ${APP_SEED_GENERATE_RISK_SNAPSHOTS:true}
  ai:
    risk:
      schedule-enabled: ${APP_AI_RISK_SCHEDULE_ENABLED:true}
    analytics-summary:
      schedule-enabled: ${APP_AI_ANALYTICS_SUMMARY_SCHEDULE_ENABLED:true}
