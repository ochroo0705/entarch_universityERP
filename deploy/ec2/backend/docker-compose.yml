services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/replace-me/edusys-backend:latest}
    container_name: edusys-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads

volumes:
  backend-logs:
  backend-uploads:
